<!DOCTYPE html>
<html lang="ms">
<head><meta charset="UTF-8"><title>Login Admin</title>
<link rel="stylesheet" href="../assets/css/style.css"></head>
<body class="login">
<div class="box">
  <h2>ADMIN LOGIN</h2>
  <input id="user" placeholder="Username" value="admin">
  <input id="pass" type="password" placeholder="Password" value="admin123">
  <button onclick="login()">LOGIN</button>
</div>
<script src="../assets/js/db.js"></script>
<script>
function login(){
  let d = DB.get();
  if(user.value==d.user && pass.value==d.pass) location.href="dashboard.html";
  else alert("Salah!");
}
</script>
</body></html>
