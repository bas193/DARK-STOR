<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK STORE PRO</title>
    <!-- Google Font Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Utama -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-gem"></i>
            <span>DARK STORE</span>
        </div>
        <button class="menu-btn" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
        </button>
    </header>

    <!-- BANNER SLIDER -->
    <section class="banner-section" id="banner-section"></section>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1>Selamat Datang Ke<br><span>DARK STORE OFFICIAL</span></h1>
        <p>Top Up Diamond Free Fire • Mobile Legends • Boost Services • Promoter — Cepat, Murah & Dipercayai!</p>
        
        <button class="btn-primary" onclick="scrollToProduk()">
            <i class="fa-solid fa-shopping-bag"></i> BELI SEKARANG
        </button>
        
        <a href="#" id="waLink" class="btn-whatsapp" target="_blank">
            <i class="fa-brands fa-whatsapp"></i> CHAT KAMI
        </a>
    </section>

    <!-- PROMO BAR -->
    <div class="promo-bar">
        <i class="fa-solid fa-fire"></i> PROMOSI: Harga Termurah & Sepantas Kilat!
    </div>

    <!-- SEARCH -->
    <section class="search-section">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 Cari produk..." onkeyup="searchProduk()">
    </section>

    <!-- CATEGORY TABS -->
    <section class="category-section">
        <div class="category-tabs" id="categoryTabs">
            <button class="tab active" onclick="pilihKategori('all', this)">Semua</button>
        </div>
    </section>

    <!-- PRODUK GRID -->
    <section class="produk-section" id="produkSection">
        <div class="produk-grid" id="produk-list"></div>
    </section>

    <!-- SIDEBAR OVERLAY -->
    <div class="overlay" id="overlay" onclick="tutupSidebar()"></div>
    
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>💎 MENU</h3>
            <button class="close-btn" onclick="tutupSidebar()"><i class="fa-solid fa-times"></i></button>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="sidebar-link" onclick="tutupSidebar()"><i class="fa-solid fa-home"></i> Utama</a>
            <a href="#produkSection" class="sidebar-link" onclick="tutupSidebar()"><i class="fa-solid fa-box"></i> Semua Produk</a>
            <a href="#" id="sideWA" target="_blank" class="sidebar-link"><i class="fa-brands fa-whatsapp"></i> Hubungi Kami</a>
            <a href="admin/login.html" class="sidebar-link admin-link"><i class="fa-solid fa-lock"></i> Admin Login</a>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
              </html>
