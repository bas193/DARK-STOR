<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetapan — TOPUP STORE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="admin-layout" onload="checkLogin(); loadSetting()">
    <aside class="admin-sidebar">
        <div class="logo"><i class="fa-solid fa-gem"></i> TOPUP STORE</div>
        <nav>
            <a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <a href="produk.html"><i class="fa-solid fa-box"></i> Produk</a>
            <a href="setting.html" class="active"><i class="fa-solid fa-cog"></i> Tetapan</a>
            <a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Keluar</a>
        </nav>
    </aside>

    <main class="admin-content">
        <div class="admin-header">
            <h1>⚙️ Tetapan Kedai</h1>
        </div>

        <div class="form-card">
            <h3 style="margin-bottom:20px">🏪 Maklumat Kedai</h3>
            
            <div class="form-group">
                <label>Nama Kedai</label>
                <input type="text" id="setNama">
            </div>
            <div class="form-group">
                <label>Nombor WhatsApp</label>
                <input type="text" id="setWa">
            </div>

            <h3 style="margin:30px 0 20px">🔐 Akaun Admin</h3>
            
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="setUser">
            </div>
            <div class="form-group">
                <label>Password Baru (Kosongkan jika tak nak tukar)</label>
                <input type="password" id="setPass" placeholder="Masukkan password baru">
            </div>

            <button class="btn btn-gold" onclick="simpanSetting()" style="width:100%;margin-top:10px">💾 SIMPAN TETAPAN</button>
        </div>

        <div style="margin-top:30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px">
            <div class="form-card" style="max-width:100%">
                <h3 style="margin-bottom:15px">📦 Backup Data</h3>
                <p style="color:var(--gray);margin-bottom:15px;font-size:14px">Muat turun semua data kedai sebagai fail backup</p>
                <button class="btn btn-green" onclick="exportData()">📤 Export Backup</button>
            </div>
            <div class="form-card" style="max-width:100%">
                <h3 style="margin-bottom:15px">ℹ️ Info</h3>
                <p style="color:var(--gray);font-size:14px">Data disimpan dalam browser. Buat backup selalu sebelum clear cache!</p>
            </div>
        </div>
    </main>

    <script src="../script.js"></script>
</body>
              </html>
