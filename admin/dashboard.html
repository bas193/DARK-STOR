<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — TOPUP STORE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="admin-layout" onload="checkLogin()">
    <aside class="admin-sidebar">
        <div class="logo"><i class="fa-solid fa-gem"></i> TOPUP STORE</div>
        <nav>
            <a href="dashboard.html" class="active"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <a href="produk.html"><i class="fa-solid fa-box"></i> Produk</a>
            <a href="setting.html"><i class="fa-solid fa-cog"></i> Tetapan</a>
            <a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Keluar</a>
        </nav>
    </aside>

    <main class="admin-content">
        <div class="admin-header">
            <h1>📊 Dashboard</h1>
            <button class="btn btn-gray" onclick="exportData()">📦 Export Backup</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="totalProduk">0</h3>
                <p>Total Produk</p>
            </div>
            <div class="stat-card">
                <h3 id="totalOrder">0</h3>
                <p>Total Pesanan</p>
            </div>
            <div class="stat-card">
                <h3 id="orderBaru">0</h3>
                <p>Pesanan Baru</p>
            </div>
            <div class="stat-card">
                <h3 id="totalJual">Rp 0</h3>
                <p>Total Jualan</p>
            </div>
        </div>

        <div class="form-card" style="max-width:100%">
            <h3 style="margin-bottom:20px">📋 Pesanan Terkini</h3>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Pembeli</th>
                            <th>Produk</th>
                            <th>Bayar</th>
                            <th>Jumlah</th>
                            <th>Status</th>
                            <th>Tindakan</th>
                        </tr>
                    </thead>
                    <tbody id="orderList"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="../script.js"></script>
</body>
  </html>
