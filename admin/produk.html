<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk — TOPUP STORE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="admin-layout" onload="checkLogin()">
    <aside class="admin-sidebar">
        <div class="logo"><i class="fa-solid fa-gem"></i> TOPUP STORE</div>
        <nav>
            <a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <a href="produk.html" class="active"><i class="fa-solid fa-box"></i> Produk</a>
            <a href="setting.html"><i class="fa-solid fa-cog"></i> Tetapan</a>
            <a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Keluar</a>
        </nav>
    </aside>

    <main class="admin-content">
        <div class="admin-header">
            <h1>📦 Urus Produk</h1>
        </div>

        <div class="form-card" id="prodForm">
            <h3 id="formTitle">➕ Tambah Produk Baru</h3>
            <input type="hidden" id="editId">
            
            <div class="form-group">
                <label>Game</label>
                <input type="text" id="prodGame" placeholder="Contoh: Free Fire">
            </div>
            <div class="form-group">
                <label>Nama Produk</label>
                <input type="text" id="prodNama" placeholder="Contoh: 12 Diamonds">
            </div>
            <div class="form-group">
                <label>Nominal</label>
                <input type="number" id="prodNominal" placeholder="Contoh: 12">
            </div>
            <div class="form-group">
                <label>Harga Asal (Rp)</label>
                <input type="number" id="prodHargaAsal" placeholder="Contoh: 1802">
            </div>
            <div class="form-group">
                <label>Harga Jual (Rp)</label>
                <input type="number" id="prodHargaJual" placeholder="Contoh: 468">
            </div>
            <label class="checkbox-container" style="margin:10px 0">
                <input type="checkbox" id="prodBest">
                <span>Jadikan Best Seller</span>
            </label>
            
            <button class="btn btn-gold" onclick="simpanProduk()" style="width:100%;margin-top:10px">💾 SIMPAN PRODUK</button>
        </div>

        <div class="form-card" style="max-width:100%">
            <h3 style="margin-bottom:20px">📋 Senarai Produk</h3>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Game</th>
                            <th>Nama</th>
                            <th>Nominal</th>
                            <th>Harga Asal</th>
                            <th>Harga Jual</th>
                            <th>Diskon</th>
                            <th>Best Seller</th>
                            <th>Tindakan</th>
                        </tr>
                    </thead>
                    <tbody id="produkList"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="../script.js"></script>
</body>
  </html>
