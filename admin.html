<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — DARK STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0f0f1a',
                        darker: '#080810',
                        gold: '#ffd700',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; }
        .tab-active { background: #ffd700; color: #000; font-weight: 700; }
        .modal-backdrop { background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); }
        input, select { background: #080810; border: 1px solid #374151; color: white; }
        input:focus, select:focus { border-color: #ffd700; outline: none; }
    </style>
</head>
<body class="bg-dark text-white min-h-screen">

    <!-- ====================================== -->
    <!-- 🔐 LOGIN SCREEN (TIDAK DIUBAH)        -->
    <!-- ====================================== -->
    <div id="loginScreen" class="fixed inset-0 flex items-center justify-center z-50 modal-backdrop">
        <div class="bg-darker rounded-2xl p-8 w-full max-w-md border border-gray-800">
            <h2 class="text-2xl font-bold text-center mb-6 text-gold">🔐 ADMIN LOGIN</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-2">Username</label>
                    <input type="text" id="username" class="w-full px-4 py-3 rounded-lg border focus:border-gold outline-none" placeholder="Masukkan username">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2">Password</label>
                    <input type="password" id="password" class="w-full px-4 py-3 rounded-lg border focus:border-gold outline-none" placeholder="Masukkan password">
                </div>
                <button onclick="login()" class="w-full bg-gold text-black font-bold py-3 rounded-lg hover:bg-yellow-400 transition">
                    LOGIN
                </button>
                <p class="text-center text-gray-500 text-sm">Default: admin / admin123</p>
            </div>
        </div>
    </div>

    <!-- ====================================== -->
    <!-- 📊 DASHBOARD (BARU DITAMBAH)          -->
    <!-- ====================================== -->
    <div id="dashboard" class="hidden">
        <!-- NAVBAR -->
        <nav class="bg-darker border-b border-gray-800 px-6 py-4 flex justify-between items-center sticky top-0 z-40">
            <h1 class="text-xl font-bold text-gold">⚙️ ADMIN DASHBOARD — DARK STORE</h1>
            <div class="flex gap-4 items-center">
                <a href="index.html" target="_blank" class="text-gray-400 hover:text-gold transition">
                    <i class="fas fa-external-link-alt mr-1"></i> Lihat Kedai
                </a>
                <button onclick="logout()" class="text-red-400 hover:text-red-300 transition">
                    <i class="fas fa-sign-out-alt mr-1"></i> Logout
                </button>
            </div>
        </nav>

        <div class="container mx-auto px-4 py-6 max-w-6xl">
            <!-- TABS NAVIGATION -->
            <div class="flex flex-wrap gap-2 mb-8">
                <button data-tab="produk" class="tab-active px-6 py-3 rounded-lg border border-gold text-black transition">
                    <i class="fas fa-box mr-2"></i> Produk
                </button>
                <button data-tab="kategori" class="px-6 py-3 rounded-lg border border-gray-600 text-gray-400 hover:border-gold hover:text-gold transition">
                    <i class="fas fa-folder mr-2"></i> Kategori
                </button>
                <button data-tab="setting" class="px-6 py-3 rounded-lg border border-gray-600 text-gray-400 hover:border-gold hover:text-gold transition">
                    <i class="fas fa-cog mr-2"></i> Tetapan
                </button>
            </div>

            <!-- ====================================== -->
            <!-- SECTION A: KAWALAN PRODUK             -->
            <!-- ====================================== -->
            <div id="tab-produk" class="tab-content">
                <div class="bg-darker rounded-xl border border-gray-800 p-6 mb-8">
                    <h2 class="text-xl font-bold text-gold mb-6">➕ TAMBAH PRODUK BARU</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold mb-2">Nama Produk</label>
                            <input type="text" id="prodName" class="w-full px-4 py-3 rounded-lg" placeholder="Contoh: 50 Diamond FF">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2">Harga</label>
                            <input type="text" id="prodPrice" class="w-full px-4 py-3 rounded-lg" placeholder="Contoh: Rp 10.000">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2">Kategori</label>
                            <select id="prodCat" class="w-full px-4 py-3 rounded-lg">
                                <!-- Auto load dari localStorage -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2">Link Gambar / Ikon</label>
                            <input type="text" id="prodImg" class="w-full px-4 py-3 rounded-lg" placeholder="Contoh: 💎 atau URL gambar">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-semibold mb-2">Deskripsi</label>
                            <input type="text" id="prodDesc" class="w-full px-4 py-3 rounded-lg" placeholder="Contoh: Proses 1-5 Minit">
                        </div>
                    </div>
                    <button onclick="tambahProduk()" class="mt-6 bg-gold text-black font-bold px-8 py-3 rounded-lg hover:bg-yellow-400 transition">
                        ✅ TAMBAH PRODUK
                    </button>
                </div>

                <!-- FILTER PRODUK -->
                <div class="mb-6">
                    <label class="block text-sm font-semibold mb-2">📂 Filter mengikut Kategori:</label>
                    <select id="filterProd" onchange="renderProduk()" class="w-full md:w-64 px-4 py-3 rounded-lg">
                        <option value="all">Semua Kategori</option>
                    </select>
                </div>

                <!-- SENARAI PRODUK -->
                <h3 class="text-lg font-bold mb-4">📦 SENARAI PRODUK (<span id="jumlahProd">0</span>)</h3>
                <div id="senaraiProduk" class="space-y-3">
                    <!-- Auto load produk -->
                </div>
            </div>

            <!-- ====================================== -->
            <!-- SECTION B: KAWALAN KATEGORI           -->
            <!-- ====================================== -->
            <div id="tab-kategori" class="tab-content hidden">
                <div class="bg-darker rounded-xl border border-gray-800 p-6 mb-8">
                    <h2 class="text-xl font-bold text-gold mb-6">➕ TAMBAH KATEGORI BARU</h2>
                    <div class="flex flex-col md:flex-row gap-4">
                        <input type="text" id="namaKategori" class="flex-1 px-4 py-3 rounded-lg" placeholder="Contoh: Free Fire">
                        <button onclick="tambahKategori()" class="bg-gold text-black font-bold px-8 py-3 rounded-lg hover:bg-yellow-400 transition whitespace-nowrap">
                            ✅ TAMBAH
                        </button>
                    </div>
                </div>

                <h3 class="text-lg font-bold mb-4">📂 SENARAI KATEGORI (<span id="jumlahCat">0</span>)</h3>
                <div id="senaraiKategori" class="space-y-3">
                    <!-- Auto load kategori -->
                </div>
            </div>

            <!-- ====================================== -->
            <!-- SECTION C: SETTING                    -->
            <!-- ====================================== -->
            <div id="tab-setting" class="tab-content hidden">
                <div class="bg-darker rounded-xl border border-gray-800 p-6 space-y-8 max-w-xl">
                    <h2 class="text-xl font-bold text-gold">⚙️ TETAPAN KEDAI</h2>
                    
                    <div>
                        <label class="block text-sm font-semibold mb-2">📞 Nombor WhatsApp Order</label>
                        <input type="text" id="setWA" class="w-full px-4 py-3 rounded-lg" placeholder="Contoh: 60194939829">
                        <p class="text-xs text-gray-500 mt-1">Hanya nombor, tanpa tanda +</p>
                    </div>

                    <hr class="border-gray-700">

                    <div>
                        <h3 class="text-lg font-bold mb-4">🔐 TUKAR AKUN ADMIN</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-semibold mb-2">Username Baru</label>
                                <input type="text" id="setUser" class="w-full px-4 py-3 rounded-lg" placeholder="Masukkan username baru">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold mb-2">Password Baru</label>
                                <input type="password" id="setPass" class="w-full px-4 py-3 rounded-lg" placeholder="Masukkan password baru">
                            </div>
                        </div>
                    </div>

                    <button onclick="simpanSetting()" class="bg-gold text-black font-bold px-8 py-3 rounded-lg hover:bg-yellow-400 transition">
                        💾 SIMPAN SEMUA TETAPAN
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ====================================== -->
    <!-- 📝 MODAL EDIT PRODUK                  -->
    <!-- ====================================== -->
    <div id="editModal" class="fixed inset-0 z-50 hidden flex items-center justify-center">
        <div class="absolute inset-0 modal-backdrop" onclick="tutupModal()"></div>
        <div class="relative bg-darker rounded-2xl p-6 w-full max-w-md border border-gray-800">
            <h3 class="text-xl font-bold text-gold mb-6">✏️ EDIT PRODUK</h3>
            <input type="hidden" id="editId">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-2">Nama Produk</label>
                    <input type="text" id="editName" class="w-full px-4 py-3 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2">Harga</label>
                    <input type="text" id="editPrice" class="w-full px-4 py-3 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2">Kategori</label>
                    <select id="editCat" class="w-full px-4 py-3 rounded-lg"></select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2">Gambar/Ikon</label>
                    <input type="text" id="editImg" class="w-full px-4 py-3 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2">Deskripsi</label>
                    <input type="text" id="editDesc" class="w-full px-4 py-3 rounded-lg">
                </div>
                <div class="flex gap-3 pt-2">
                    <button onclick="tutupModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 py-3 rounded-lg transition">Batal</button>
                    <button onclick="simpanEdit()" class="flex-1 bg-gold text-black font-bold py-3 rounded-lg hover:bg-yellow-400 transition">Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== DATA DEFAULT ==========
        const DEFAULT_ADMIN = { username: 'admin', password: 'admin123' };
        const DEFAULT_SETTINGS = { waNumber: '60194939829' };
        const DEFAULT_CATEGORIES = ['Free Fire', 'Mobile Legends', 'Boost Service'];
        const DEFAULT_PRODUCTS = [
            { id: 1, name: '50 Diamond FF', price: 'Rp 10.000', category: 'Free Fire', image: '💎', desc: 'Proses 1-5 Minit' },
            { id: 2, name: '140 Diamond FF', price: 'Rp 25.000', category: 'Free Fire', image: '💎', desc: 'Proses 1-5 Minit' },
            { id: 3, name: '355 Diamond FF', price: 'Rp 60.000', category: 'Free Fire', image: '💎', desc: 'Proses 1-5 Minit' },
            { id: 4, name: '86 Diamonds ML', price: 'Rp 20.000', category: 'Mobile Legends', image: '💎', desc: 'Proses 1-5 Minit' },
            { id: 5, name: '172 Diamonds ML', price: 'Rp 40.000', category: 'Mobile Legends', image: '💎', desc: 'Proses 1-5 Minit' },
            { id: 6, name: 'Joki Rank ML Mythic Glory', price: 'Hubungi WA', category: 'Boost Service', image: '🏆', desc: 'Sila chat untuk harga' }
        ];

        // ========== STATE ==========
        let isLoggedIn = false;
        let admin = JSON.parse(localStorage.getItem('ds_admin')) || DEFAULT_ADMIN;
        let settings = JSON.parse(localStorage.getItem('ds_settings')) || DEFAULT_SETTINGS;
        let categories = JSON.parse(localStorage.getItem('ds_categories')) || DEFAULT_CATEGORIES;
        let products = JSON.parse(localStorage.getItem('ds_products')) || DEFAULT_PRODUCTS;

        // ========== SAVE DATA ==========
        function saveAll() {
            localStorage.setItem('ds_admin', JSON.stringify(admin));
            localStorage.setItem('ds_settings', JSON.stringify(settings));
            localStorage.setItem('ds_categories', JSON.stringify(categories));
            localStorage.setItem('ds_products', JSON.stringify(products));
        }

        // ========== LOGIN ==========
        function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            
            if (user === admin.username && pass === admin.password) {
                isLoggedIn = true;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                loadSettings();
                renderSemua();
            } else {
                alert('❌ Username atau Password salah!');
            }
        }

        function logout() {
            isLoggedIn = false;
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // ========== TABS ==========
        document.querySelectorAll('[data-tab]').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('[data-tab]').forEach(btn => {
                    btn.classList.remove('tab-active', 'border-gold', 'text-black');
                    btn.classList.add('border-gray-600', 'text-gray-400');
                });
                tab.classList.add('tab-active');
                tab.classList.remove('border-gray-600', 'text-gray-400');
                
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                document.getElementById(`tab-${tab.dataset.tab}`).classList.remove('hidden');
            });
        });

        // ========== KATEGORI ==========
        function renderKategori() {
            const list = document.getElementById('senaraiKategori');
            document.getElementById('jumlahCat').textContent = categories.length;
            list.innerHTML = '';
            
            categories.forEach((cat, i) => {
                list.innerHTML += `
                    <div class="bg-darker p-4 rounded-lg border border-gray-800 flex justify-between items-center">
                        <span class="font-bold">📂 ${cat}</span>
                        <button onclick="hapusKategori(${i})" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm">
                            <i class="fas fa-trash"></i> Hapus
                        </button>
                    </div>
                `;
            });
        }

        function tambahKategori() {
            const nama = document.getElementById('namaKategori').value.trim();
            if (!nama) { alert('Nama kategori wajib diisi!'); return; }
            if (categories.includes(nama)) { alert('Kategori ini sudah ada!'); return; }
            
            categories.push(nama);
            saveAll();
            renderKategori();
            updateCategorySelects();
            document.getElementById('namaKategori').value = '';
        }

        function hapusKategori(index) {
            if (!confirm('⚠️ Pasti nak hapus kategori ini? Produk dalam kategori ini TIDAK akan dipadam.')) return;
            categories.splice(index, 1);
            saveAll();
            renderKategori();
            updateCategorySelects();
        }

        // ========== PRODUK ==========
        function renderProduk() {
            const filter = document.getElementById('filterProd').value;
            let filtered = filter === 'all' ? products : products.filter(p => p.category === filter);
            
            const list = document.getElementById('senaraiProduk');
            document.getElementById('jumlahProd').textContent = filtered.length;
            list.innerHTML = '';
            
            filtered.forEach(p => {
                list.innerHTML += `
                    <div class="bg-darker p-4 rounded-lg border border-gray-800">
                        <div class="flex flex-col md:flex-row md:items-center gap-4">
                            <div class="text-3xl">${p.image || '💎'}</div>
                            <div class="flex-1">
                                <h4 class="font-bold text-lg">${p.name}</h4>
                                <p class="text-gold font-bold">${p.price}</p>
                                <p class="text-sm text-gray-500">${p.category} • ${p.desc}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="bukaEdit(${p.id})" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm">
                                    <i class="fas fa-edit"></i> Edit
                                </button>
                                <button onclick="hapusProduk(${p.id})" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm">
                                    <i class="fas fa-trash"></i> Hapus
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function tambahProduk() {
            const name = document.getElementById('prodName').value.trim();
            const price = document.getElementById('prodPrice').value.trim();
            const cat = document.getElementById('prodCat').value;
            const img = document.getElementById('prodImg').v
